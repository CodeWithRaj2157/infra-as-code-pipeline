name: Infra as Code Pipeline

on:
  pull_request:
    branches:
      - main
      - staging

  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

##########################################################
# JOBS
##########################################################

jobs:

##########################################################
# TERRAFORM VALIDATION
##########################################################

  terraform-validation:

    name: Terraform Validate

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Setup Terraform
      ####################################################

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_wrapper: false

      ####################################################
      # Terraform Version
      ####################################################

      - name: Terraform Version

        run: terraform version

      ####################################################
      # Terraform Init
      ####################################################

      - name: Terraform Init

        run: terraform init

      ####################################################
      # Terraform Format Check
      ####################################################

      - name: Terraform Format

        run: terraform fmt -check -recursive

      ####################################################
      # Terraform Validate
      ####################################################

      - name: Terraform Validate

        run: terraform validate

      ####################################################
      # Upload Terraform Source
      ####################################################

      - name: Upload Terraform Source

        uses: actions/upload-artifact@v4

        with:
          name: terraform-source
          path: terraform

##########################################################
# TERRAFORM LINT
##########################################################

  terraform-lint:

    name: Terraform Lint

    needs: terraform-validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Install TFLint
      ####################################################

      - name: Install TFLint

        uses: terraform-linters/setup-tflint@v4

      ####################################################
      # Verify Version
      ####################################################

      - name: Check Version

        run: tflint --version

      ####################################################
      # Initialize Rules
      ####################################################

      - name: Initialize TFLint

        run: tflint --init

      ####################################################
      # Execute TFLint
      ####################################################

      - name: Run TFLint

        run: tflint

      ####################################################
      # Upload Lint Report
      ####################################################

      - name: Upload Lint Report

        uses: actions/upload-artifact@v4

        with:
          name: terraform-lint
          path: terraform

##########################################################
# PART B STARTS BELOW
####################################################################################################################
# DOCKER BUILD & PUSH
##########################################################

  docker-build:

    name: Build & Push Docker Image

    needs:
      - terraform-validation
      - terraform-lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    outputs:
      image-uri: ${{ steps.export-image.outputs.image }}

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Login to Amazon ECR
      ####################################################

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Show Docker Version
      ####################################################

      - name: Docker Version

        run: docker version

      ####################################################
      # Build Docker Image
      ####################################################

      - name: Build Docker Image

        run: |

          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      ####################################################
      # Tag Docker Image
      ####################################################

      - name: Tag Docker Image

        run: |

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Push Docker Image
      ####################################################

      - name: Push Docker Image

        run: |

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Verify Image Exists in ECR
      ####################################################

      - name: Verify Image

        run: |

          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${{ github.sha }}

      ####################################################
      # Export Image URI
      ####################################################

      - name: Export Image URI

        id: export-image

        run: |

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Built Image: $IMAGE_URI"

      ####################################################
      # Save Image URI
      ####################################################

      - name: Save Image URI

        run: |

          echo "${{ steps.export-image.outputs.image }}" > image.txt

      ####################################################
      # Upload Image Artifact
      ####################################################

      - name: Upload Image Artifact

        uses: actions/upload-artifact@v4

        with:
          name: docker-image

          path: image.txt

      ####################################################
      # Download Terraform Artifact
      ####################################################

      - name: Download Terraform Source

        uses: actions/download-artifact@v4

        with:
          name: terraform-source

      ####################################################
      # Build Summary
      ####################################################

      - name: Build Summary

        run: |

          echo "========================================="
          echo "Docker Build Completed"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : ${{ github.sha }}"
          echo "Region     : $AWS_REGION"
          echo "========================================="

##########################################################
# PART C STARTS BELOW
#########################################################


          ##########################################################
# DOCKER BUILD & PUSH
##########################################################

  docker-build:

    name: Build & Push Docker Image

    needs:
      - terraform-validation
      - terraform-lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    outputs:
      image-uri: ${{ steps.export-image.outputs.image }}

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Login to Amazon ECR
      ####################################################

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Show Docker Version
      ####################################################

      - name: Docker Version

        run: docker version

      ####################################################
      # Build Docker Image
      ####################################################

      - name: Build Docker Image

        run: |

          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      ####################################################
      # Tag Docker Image
      ####################################################

      - name: Tag Docker Image

        run: |

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Push Docker Image
      ####################################################

      - name: Push Docker Image

        run: |

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Verify Image Exists in ECR
      ####################################################

      - name: Verify Image

        run: |

          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${{ github.sha }}

      ####################################################
      # Export Image URI
      ####################################################

      - name: Export Image URI

        id: export-image

        run: |

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Built Image: $IMAGE_URI"

      ####################################################
      # Save Image URI
      ####################################################

      - name: Save Image URI

        run: |

          echo "${{ steps.export-image.outputs.image }}" > image.txt

      ####################################################
      # Upload Image Artifact
      ####################################################

      - name: Upload Image Artifact

        uses: actions/upload-artifact@v4

        with:
          name: docker-image

          path: image.txt

      ####################################################
      # Download Terraform Artifact
      ####################################################

      - name: Download Terraform Source

        uses: actions/download-artifact@v4

        with:
          name: terraform-source

      ####################################################
      # Build Summary
      ####################################################

      - name: Build Summary

        run: |

          echo "========================================="
          echo "Docker Build Completed"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : ${{ github.sha }}"
          echo "Region     : $AWS_REGION"
          echo "========================================="

##########################################################
# PART C STARTS BELOW
##########################################################


##########################################################
# ECS STAGING DEPLOYMENT
##########################################################

  deploy-staging:

    name: Deploy to Staging

    if: github.event_name == 'pull_request'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Save Previous Task Definition
      ####################################################

      - name: Save Previous Task Definition

        run: |

          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].taskDefinition" \
            --output text > previous-task.txt

      ####################################################
      # Show Previous Task Definition
      ####################################################

      - name: Previous Task Definition

        run: |

          cat previous-task.txt

      ####################################################
      # Force New Deployment
      ####################################################

      - name: Deploy Application

        run: |

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      ####################################################
      # Wait Until ECS Service Stable
      ####################################################

      - name: Wait for Stable Service

        run: |

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Verify Running Tasks
      ####################################################

      - name: Verify Running Tasks

        run: |

          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Upload Previous Task Definition
      ####################################################

      - name: Upload Previous Task Definition

        uses: actions/upload-artifact@v4

        with:
          name: previous-task

          path: previous-task.txt

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary

        run: |

          echo "===================================="
          echo "Staging Deployment Completed"
          echo "Cluster : $ECS_CLUSTER"
          echo "Service : $ECS_SERVICE"
          echo "Region  : $AWS_REGION"
          echo "===================================="

##########################################################
# PART D STARTS BELOW
##########################################################

##########################################################
# PRODUCTION DEPLOYMENT
##########################################################

  deploy-production:

    name: Deploy to Production

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    ####################################################
    # GitHub Environment
    # Configure "production" environment in GitHub
    # with Required Reviewers enabled.
    ####################################################

    environment:
      name: production

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Save Current Task Definition
      ####################################################

      - name: Save Current Task Definition

        run: |

          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].taskDefinition" \
            --output text > previous-task.txt

      ####################################################
      # Force New Deployment
      ####################################################

      - name: Deploy Latest Image

        run: |

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      ####################################################
      # Wait Until Stable
      ####################################################

      - name: Wait For ECS Stability

        run: |

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Health Check
      ####################################################

      - name: Health Check

        run: |

          ALB_URL="http://YOUR-ALB-DNS/health"

          SUCCESS=0

          echo "Waiting for application..."

          for i in {1..10}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL")

            echo "Attempt $i : HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              SUCCESS=1
              break
            fi

            sleep 30

          done

          if [ "$SUCCESS" = "0" ]; then
            echo "Health check failed."
            exit 1
          fi

          echo "Application Healthy."

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary

        if: success()

        run: |

          echo "=================================="
          echo "Production Deployment Successful"
          echo "Cluster : $ECS_CLUSTER"
          echo "Service : $ECS_SERVICE"
          echo "Region  : $AWS_REGION"
          echo "=================================="

##########################################################
# HEALTH CHECK COMPLETE
# PART E STARTS BELOW
##########################################################

##########################################################
# AUTOMATIC ROLLBACK
##########################################################

      ####################################################
      # Rollback Deployment
      ####################################################

      - name: Rollback Deployment

        if: failure()

        run: |

          echo "Deployment failed."

          echo "Starting rollback..."

          PREVIOUS_TASK=$(cat previous-task.txt)

          echo "Previous Task Definition:"

          echo $PREVIOUS_TASK

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $PREVIOUS_TASK

      ####################################################
      # Wait for Rollback
      ####################################################

      - name: Wait for Rollback

        if: failure()

        run: |

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

##########################################################
# CLEANUP
##########################################################

      ####################################################
      # Remove Temporary Files
      ####################################################

      - name: Cleanup Workspace

        if: always()

        run: |

          rm -f previous-task.txt

          rm -f image.txt

          docker image prune -af || true

##########################################################
# JOB SUMMARY
##########################################################

      ####################################################
      # Success Summary
      ####################################################

      - name: Success Summary

        if: success()

        run: |

          echo "=========================================="

          echo "Deployment Successful"

          echo ""

          echo "Project        : Infra as Code Pipeline"

          echo "Environment    : Production"

          echo "AWS Region     : $AWS_REGION"

          echo "Cluster        : $ECS_CLUSTER"

          echo "Service        : $ECS_SERVICE"

          echo "Repository     : $ECR_REPOSITORY"

          echo "Commit SHA     : ${{ github.sha }}"

          echo "=========================================="

##########################################################
# FAILURE SUMMARY
##########################################################

      ####################################################
      # Failure Summary
      ####################################################

      - name: Failure Summary

        if: failure()

        run: |

          echo "=========================================="

          echo "Deployment Failed"

          echo ""

          echo "Rollback Executed"

          echo ""

          echo "Cluster     : $ECS_CLUSTER"

          echo "Service     : $ECS_SERVICE"

          echo "Repository  : $ECR_REPOSITORY"

          echo "Commit SHA  : ${{ github.sha }}"

          echo ""

          echo "Please check ECS Events"

          echo "CloudWatch Logs"

          echo "Target Group Health"

          echo "GitHub Actions Logs"

          echo "=========================================="

##########################################################
# END OF FILE
##########################################################

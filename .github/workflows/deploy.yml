name: Infra as Code Pipeline

##########################################################
# TRIGGERS
##########################################################

on:
  pull_request:
    branches:
      - main
      - staging

  push:
    branches:
      - main
      - staging

##########################################################
# PERMISSIONS
##########################################################

permissions:
  contents: read
  id-token: write

##########################################################
# GLOBAL ENVIRONMENT VARIABLES
##########################################################

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

##########################################################
# JOBS
##########################################################

jobs:

##########################################################
# TERRAFORM VALIDATION
##########################################################

  terraform-validation:

    name: Terraform Validate

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Setup Terraform
      ####################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      ####################################################
      # Show Terraform Version
      ####################################################

      - name: Terraform Version
        run: terraform version

      ####################################################
      # Terraform Init
      ####################################################

      - name: Terraform Init
        run: terraform init

      ####################################################
      # Terraform Format Check
      ####################################################

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      ####################################################
      # Terraform Validate
      ####################################################

      - name: Terraform Validate
        run: terraform validate

      ####################################################
      # Upload Terraform Source
      ####################################################

      - name: Upload Terraform Source
        uses: actions/upload-artifact@v4
        with:
          name: terraform-source
          path: terraform

##########################################################
# TERRAFORM LINT
##########################################################

  terraform-lint:

    name: Terraform Lint

    needs: terraform-validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Install TFLint
      ####################################################

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      ####################################################
      # Verify TFLint Version
      ####################################################

      - name: Check TFLint Version
        run: tflint --version

      ####################################################
      # Initialize TFLint Rules
      ####################################################

      - name: Initialize TFLint
        run: tflint --init

      ####################################################
      # Run TFLint
      ####################################################

      - name: Run TFLint
        run: tflint

      ####################################################
      # Upload Lint Report
      ####################################################

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-lint
          path: terraform

##########################################################
# DOCKER BUILD & PUSH TO AMAZON ECR
##########################################################

  docker-build:

    name: Build & Push Docker Image

    needs:
      - terraform-validation
      - terraform-lint

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    outputs:
      image-uri: ${{ steps.export-image.outputs.image }}

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Login to Amazon ECR
      ####################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Debug ECR Registry
        run: |
          echo "Registry=${{ steps.login-ecr.outputs.registry }}"
          echo "Repository=$ECR_REPOSITORY"
      ####################################################
      # Show Docker Version
      ####################################################

      - name: Docker Version
        run: docker version

      ####################################################
      # Build Docker Image
      ####################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      ####################################################
      # Tag Docker Image
      ####################################################

      - name: Tag Docker Image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Push Docker Image
      ####################################################

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      ####################################################
      # Verify Image Exists in Amazon ECR
      ####################################################

      - name: Verify Image in ECR
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${{ github.sha }}

      ####################################################
      # Export Image URI
      ####################################################

      - name: Export Image URI
        id: export-image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Built Image: $IMAGE_URI"


          
      - name: Debug Image URI
        run: |
          echo "Registry = ${{ steps.login-ecr.outputs.registry }}"
          echo "Repository = $ECR_REPOSITORY"
          echo "Image URI = ${{ steps.export-image.outputs.image }}"
          
      ####################################################
      # Save Image URI
      ####################################################

      - name: Save Image URI
        run: |
          echo "${{ steps.export-image.outputs.image }}" > image.txt

      ####################################################
      # Upload Image Artifact
      ####################################################

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.txt

      ####################################################
      # Download Terraform Artifact
      ####################################################

      - name: Download Terraform Source
        uses: actions/download-artifact@v4
        with:
          name: terraform-source

      ####################################################
      # Build Summary
      ####################################################

      - name: Build Summary
        run: |
          echo "========================================="
          echo "Docker Build Completed Successfully"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : ${{ github.sha }}"
          echo "Region     : $AWS_REGION"
          echo "Image URI  : ${{ steps.export-image.outputs.image }}"
          echo "========================================="

##########################################################
# STAGING DEPLOYMENT
##########################################################

  deploy-staging:

    name: Deploy to Staging

    if: github.event_name == 'pull_request'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Save Current Task Definition
      ####################################################

      - name: Save Current Task Definition
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].taskDefinition" \
            --output text > previous-task.txt

      ####################################################
      # Display Previous Task Definition
      ####################################################

      - name: Show Previous Task Definition
        run: cat previous-task.txt

      ####################################################
      # Download Current ECS Task Definition
      ####################################################

      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition infra-as-code-pipeline-dev-task \
            > task-definition.json

            
      - name: Debug Deployment Image
        run: |
          echo "Image from docker-build job:"
          echo "${{ needs.docker-build.outputs.image-uri }}"

        
      ####################################################
      # Render Updated Task Definition
      ####################################################

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ needs.docker-build.outputs.image-uri }}

      ####################################################
      # Deploy Updated Task Definition
      ####################################################

      - name: Deploy ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      ####################################################
      # Wait Until ECS Service Is Stable
      ####################################################

      - name: Wait for Stable Service
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Verify Running Service
      ####################################################

      - name: Verify ECS Service
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Upload Previous Task Definition
      ####################################################

      - name: Upload Previous Task Definition
        uses: actions/upload-artifact@v4
        with:
          name: previous-task
          path: previous-task.txt

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary
        run: |
          echo "===================================="
          echo "Staging Deployment Successful"
          echo "Cluster : $ECS_CLUSTER"
          echo "Service : $ECS_SERVICE"
          echo "Image   : ${{ needs.docker-build.outputs.image-uri }}"
          echo "Region  : $AWS_REGION"
          echo "===================================="

##########################################################
# PRODUCTION DEPLOYMENT
##########################################################

  deploy-production:

    name: Deploy to Production

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Save Current Task Definition
      ####################################################

      - name: Save Current Task Definition
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].taskDefinition" \
            --output text > previous-task.txt

      ####################################################
      # Download Current ECS Task Definition
      ####################################################

      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition infra-as-code-pipeline-dev-task \
            --query taskDefinition \
            > task-definition.json

      ####################################################
      # Render New Task Definition
      ####################################################

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      ####################################################
      # Deploy Updated Task Definition
      ####################################################

      - name: Deploy ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      ####################################################
      # Wait Until ECS Service Is Stable
      ####################################################

      - name: Wait for Stable Service
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Verify ECS Service
      ####################################################

      - name: Verify ECS Service
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      ####################################################
      # Application Health Check
      ####################################################

      - name: Application Health Check
        run: |

          ALB_URL="http://infra-as-code-pipeline-dev-alb-1133611598.ap-south-1.elb.amazonaws.com/health"

          SUCCESS=0

          echo "Waiting for application to become healthy..."

          for i in {1..10}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL")

            echo "Attempt $i : HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              SUCCESS=1
              break
            fi

            sleep 30

          done

          if [ "$SUCCESS" = "0" ]; then
            echo "Health check failed."
            exit 1
          fi

          echo "Application is healthy."

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary
        if: success()
        run: |
          echo "======================================"
          echo "Production Deployment Successful"
          echo "Cluster    : $ECS_CLUSTER"
          echo "Service    : $ECS_SERVICE"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image      : ${{ needs.docker-build.outputs.image-uri }}"
          echo "Region     : $AWS_REGION"
          echo "Commit SHA : ${{ github.sha }}"
          echo "======================================"

##########################################################
# ROLLBACK, CLEANUP & SUMMARY
##########################################################

      ####################################################
      # Automatic Rollback
      ####################################################

      - name: Rollback Deployment
        if: failure()
        run: |

          echo "Deployment failed."
          echo "Starting rollback..."

          PREVIOUS_TASK=$(cat previous-task.txt)

          echo "Previous Task Definition:"
          echo "$PREVIOUS_TASK"

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition "$PREVIOUS_TASK"

      ####################################################
      # Wait For Rollback
      ####################################################

      - name: Wait for Rollback
        if: failure()
        run: |

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

          echo "Rollback completed successfully."

      ####################################################
      # Cleanup Workspace
      ####################################################

      - name: Cleanup Workspace
        if: always()
        run: |

          rm -f previous-task.txt
          rm -f task-definition.json
          rm -f image.txt

          docker image prune -af || true

      ####################################################
      # Success Summary
      ####################################################

      - name: Success Summary
        if: success()
        run: |

          echo "=========================================="
          echo "Production Deployment Successful"
          echo ""
          echo "Project        : Infra as Code Pipeline"
          echo "Environment    : Production"
          echo "AWS Region     : $AWS_REGION"
          echo "Cluster        : $ECS_CLUSTER"
          echo "Service        : $ECS_SERVICE"
          echo "Repository     : $ECR_REPOSITORY"
          echo "Image          : ${{ needs.docker-build.outputs.image-uri }}"
          echo "Commit SHA     : ${{ github.sha }}"
          echo "Workflow       : GitHub Actions"
          echo "=========================================="

      ####################################################
      # Failure Summary
      ####################################################

      - name: Failure Summary
        if: failure()
        run: |

          echo "=========================================="
          echo "Production Deployment Failed"
          echo ""
          echo "Rollback Executed Successfully"
          echo ""
          echo "Cluster        : $ECS_CLUSTER"
          echo "Service        : $ECS_SERVICE"
          echo "Repository     : $ECR_REPOSITORY"
          echo "Commit SHA     : ${{ github.sha }}"
          echo ""
          echo "Check the following:"
          echo " - GitHub Actions Logs"
          echo " - Amazon ECS Events"
          echo " - CloudWatch Logs"
          echo " - Target Group Health"
          echo "=========================================="

